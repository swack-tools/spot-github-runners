name: Control watchdog image

# Builds watchdog/Dockerfile and pushes it to Artifact Registry with Workload Identity Federation (no stored key).
# Inert until the repository variables below are set (src/control_watchdog_deploy.py --dry-run prints them):
#   WATCHDOG_IMAGE          <region>-docker.pkg.dev/<project>/<repository>/control-watchdog
#   WATCHDOG_PUBLISHER_SA   the publisher service account e-mail
#   WATCHDOG_WIF_PROVIDER   projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   WATCHDOG_BASE_IMAGE     gcr.io/google.com/cloudsdktool/google-cloud-cli:<version>-slim@sha256:<digest>
# A pushed image changes nothing by itself. The deploy job rolls the Cloud Run service to it only when this variable
# is also set (a deploy with SPOT_WATCHDOG_AUTO_DEPLOY=1 creates the account and prints it):
#   WATCHDOG_DEPLOYER_SA    the deployer service account e-mail
# The deploy job swaps only the service's image, after the build and smoke test passed, and refuses any image whose
# commit is not strictly ahead of the deployed image's commit (a re-run of an older run never rolls back).
#
# The "autoscaler" job builds autoscaler/Dockerfile into the same repository (image spot-runner-autoscaler, for the
# Cloud Run job of src/spot_runner_autoscaler_deploy.py) with the same publisher. It also needs:
#   AUTOSCALER_GH_VERSION   the GitHub CLI release the image installs, for example 2.62.0
#   AUTOSCALER_GH_SHA256    the SHA-256 of that release's gh_<version>_linux_amd64.tar.gz
# It never deploys: src/spot_runner_autoscaler_deploy.py pins the digest the job runs.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "cloud-init/control-vm-startup.sh"
      - "runner/job-started.sh"
      - "builder/docker-admission.py"
      - "watchdog/**"
      - "autoscaler/**"
      - "cloud-init/**"
      - "runner/**"
      - "builder/**"
      - ".dockerignore"
      - ".github/workflows/control-watchdog-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: control-watchdog-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.WATCHDOG_IMAGE != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      IMAGE: ${{ vars.WATCHDOG_IMAGE }}
      BASE_IMAGE: ${{ vars.WATCHDOG_BASE_IMAGE }}
      PUBLISHER_SA: ${{ vars.WATCHDOG_PUBLISHER_SA }}
      WIF_PROVIDER: ${{ vars.WATCHDOG_WIF_PROVIDER }}
    steps:
      - name: Check settings
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$BASE_IMAGE" =~ ^gcr\.io/google\.com/cloudsdktool/google-cloud-cli:[0-9][0-9.]*-slim@sha256:[0-9a-f]{64}$ ]] \
            || fail "WATCHDOG_BASE_IMAGE must be google-cloud-cli:<version>-slim pinned by digest"
          [[ "$IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z][a-z0-9-]+/[a-z][a-z0-9-]*/control-watchdog$ ]] \
            || fail "WATCHDOG_IMAGE must be <region>-docker.pkg.dev/<project>/<repository>/control-watchdog"
          [[ "$PUBLISHER_SA" =~ ^[a-z][a-z0-9-]+@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] \
            || fail "WATCHDOG_PUBLISHER_SA must be a service account e-mail"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || fail "WATCHDOG_WIF_PROVIDER must be the provider's full resource name"

      - name: Check out
        # actions/checkout v4, pinned to the commit the v4 tag resolved to on 2026-10-17.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build \
            --pull \
            --file watchdog/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python3 "${IMAGE}:${GITHUB_SHA}" -B -c \
            "import lib.control_vm, lib.gcs_control_state, lib.image_tracking, lib.control_watchdog_server; print('imports ok')"
          docker run --rm --entrypoint python3 "${IMAGE}:${GITHUB_SHA}" -B /app/src/control_vm.py ensure --help \
            | grep -q -- --skip-if-idle
          # The server answers /health, and refuses a tick without an identity token.
          docker run -d --name watchdog-smoke -p 127.0.0.1:18080:8080 -e WATCHDOG_PROJECT=smoke \
            -e WATCHDOG_AUDIENCE=https://smoke.invalid -e WATCHDOG_INVOKER=smoke@smoke.invalid "${IMAGE}:${GITHUB_SHA}"
          trap 'docker rm -f watchdog-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health | grep -q '"ok"'
          status="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/tick)"
          [[ "$status" == 403 ]] || { echo "::error::unauthenticated tick answered ${status}"; exit 1; }

      - name: Authenticate to Artifact Registry
        run: |
          set -euo pipefail
          registry="${IMAGE%%/*}"
          audience="https://iam.googleapis.com/${WIF_PROVIDER}"
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r '.value')"
          echo "::add-mask::${oidc}"
          federated="$(jq -n --arg aud "//iam.googleapis.com/${WIF_PROVIDER}" --arg token "${oidc}" '{
              audience: $aud,
              grantType: "urn:ietf:params:oauth:grant-type:token-exchange",
              requestedTokenType: "urn:ietf:params:oauth:token-type:access_token",
              scope: "https://www.googleapis.com/auth/cloud-platform",
              subjectTokenType: "urn:ietf:params:oauth:token-type:jwt",
              subjectToken: $token}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- https://sts.googleapis.com/v1/token \
            | jq -r '.access_token')"
          echo "::add-mask::${federated}"
          access="$(curl -fsS -X POST -H "Authorization: Bearer ${federated}" -H "Content-Type: application/json" \
            --data '{"scope": ["https://www.googleapis.com/auth/cloud-platform"], "lifetime": "600s"}' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${PUBLISHER_SA}:generateAccessToken" \
            | jq -r '.accessToken')"
          echo "::add-mask::${access}"
          [[ -n "$access" && "$access" != null ]] || { echo "::error::no access token"; exit 1; }
          printf '%s' "${access}" | docker login --username oauth2accesstoken --password-stdin "https://${registry}"

      - name: Push
        id: push
        env:
          DEPLOYER_SA: ${{ vars.WATCHDOG_DEPLOYER_SA }}
        run: |
          # A commit tag never moves: a re-run of a commit that was already pushed reuses its image, so the deployed
          # digest keeps the commit tag the deploy job reads to prove the next commit is newer.
          # Push only when the registry says the tag is absent; any other lookup failure stops the job.
          if lookup="$(docker manifest inspect "${IMAGE}:${GITHUB_SHA}" 2>&1 >/dev/null)"; then
            echo "::notice::${IMAGE}:${GITHUB_SHA} already exists; reusing it instead of moving the tag"
            docker pull --quiet "${IMAGE}:${GITHUB_SHA}" >/dev/null
          elif grep -qiE 'no such manifest|manifest unknown' <<<"${lookup}"; then
            docker push "${IMAGE}:${GITHUB_SHA}"
          else
            echo "::error::could not tell whether ${IMAGE}:${GITHUB_SHA} exists: ${lookup}"
            exit 1
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")"
          [[ "$digest" == "${IMAGE}@sha256:"* && "$digest" =~ @sha256:[0-9a-f]{64}$ ]] \
            || { echo "::error::unexpected digest ${digest}"; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Control watchdog image"
            echo
            echo "| Reference | Value |"
            echo "| --- | --- |"
            echo "| Commit tag | \`${IMAGE}:${GITHUB_SHA}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Base | \`${BASE_IMAGE}\` |"
            echo
            if [[ -n "${DEPLOYER_SA}" ]]; then
              echo "The deploy job rolls the watchdog to it."
            else
              echo "Deploy it with \`src/control_watchdog_deploy.py --image=${digest}\` (dry run first)."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out
        if: always()
        run: docker logout "${IMAGE%%/*}" || true

  deploy:
    needs: build
    if: ${{ vars.WATCHDOG_DEPLOYER_SA != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: ${{ vars.WATCHDOG_IMAGE }}
      DEPLOYER_SA: ${{ vars.WATCHDOG_DEPLOYER_SA }}
      WIF_PROVIDER: ${{ vars.WATCHDOG_WIF_PROVIDER }}
      DIGEST: ${{ needs.build.outputs.digest }}
    steps:
      - name: Check settings
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$IMAGE" =~ ^([a-z0-9-]+)-docker\.pkg\.dev/([a-z][a-z0-9-]+)/[a-z][a-z0-9-]*/control-watchdog$ ]] \
            || fail "WATCHDOG_IMAGE must be <region>-docker.pkg.dev/<project>/<repository>/control-watchdog"
          echo "REGION=${BASH_REMATCH[1]}" >> "${GITHUB_ENV}"
          echo "PROJECT=${BASH_REMATCH[2]}" >> "${GITHUB_ENV}"
          [[ "$DEPLOYER_SA" =~ ^[a-z][a-z0-9-]+@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] \
            || fail "WATCHDOG_DEPLOYER_SA must be a service account e-mail"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || fail "WATCHDOG_WIF_PROVIDER must be the provider's full resource name"
          [[ "$DIGEST" == "${IMAGE}@sha256:"* && "$DIGEST" =~ @sha256:[0-9a-f]{64}$ ]] \
            || fail "the build job did not report a digest of ${IMAGE}"

      - name: Check out
        # actions/checkout v4, pinned to the commit the v4 tag resolved to on 2026-10-17. Full history: the deploy
        # proves the new commit descends from the deployed one.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Plan
        run: |
          python3 -B src/control_watchdog_deploy.py --dry-run --project="${PROJECT}" --region="${REGION}" \
            --update-image="${DIGEST}" --revision="${GITHUB_SHA}"

      - name: Authenticate as the deployer
        run: |
          set -euo pipefail
          audience="https://iam.googleapis.com/${WIF_PROVIDER}"
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r '.value')"
          echo "::add-mask::${oidc}"
          federated="$(jq -n --arg aud "//iam.googleapis.com/${WIF_PROVIDER}" --arg token "${oidc}" '{
              audience: $aud,
              grantType: "urn:ietf:params:oauth:grant-type:token-exchange",
              requestedTokenType: "urn:ietf:params:oauth:token-type:access_token",
              scope: "https://www.googleapis.com/auth/cloud-platform",
              subjectTokenType: "urn:ietf:params:oauth:token-type:jwt",
              subjectToken: $token}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- https://sts.googleapis.com/v1/token \
            | jq -r '.access_token')"
          echo "::add-mask::${federated}"
          access="$(curl -fsS -X POST -H "Authorization: Bearer ${federated}" -H "Content-Type: application/json" \
            --data '{"scope": ["https://www.googleapis.com/auth/cloud-platform"], "lifetime": "1200s"}' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${DEPLOYER_SA}:generateAccessToken" \
            | jq -r '.accessToken')"
          echo "::add-mask::${access}"
          [[ -n "$access" && "$access" != null ]] || { echo "::error::no access token"; exit 1; }
          token_file="${RUNNER_TEMP}/gcloud-access-token"
          ( umask 077; printf '%s' "${access}" > "${token_file}" )
          echo "CLOUDSDK_AUTH_ACCESS_TOKEN_FILE=${token_file}" >> "${GITHUB_ENV}"

      - name: Deploy
        env:
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
          CLOUDSDK_CONFIG: ${{ runner.temp }}/gcloud-config
        run: |
          set -euo pipefail
          result="$(python3 -B src/control_watchdog_deploy.py --project="${PROJECT}" --region="${REGION}" \
            --update-image="${DIGEST}" --revision="${GITHUB_SHA}")"
          echo "${result}"
          {
            echo "### Control watchdog deploy"
            echo
            echo "${result}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the access token
        if: always()
        run: rm -f "${RUNNER_TEMP}/gcloud-access-token"

  autoscaler:
    if: ${{ vars.WATCHDOG_IMAGE != '' && vars.AUTOSCALER_GH_VERSION != '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WATCHDOG_IMAGE: ${{ vars.WATCHDOG_IMAGE }}
      BASE_IMAGE: ${{ vars.WATCHDOG_BASE_IMAGE }}
      GH_VERSION: ${{ vars.AUTOSCALER_GH_VERSION }}
      GH_SHA256: ${{ vars.AUTOSCALER_GH_SHA256 }}
      PUBLISHER_SA: ${{ vars.WATCHDOG_PUBLISHER_SA }}
      WIF_PROVIDER: ${{ vars.WATCHDOG_WIF_PROVIDER }}
    steps:
      - name: Check settings
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$BASE_IMAGE" =~ ^gcr\.io/google\.com/cloudsdktool/google-cloud-cli:[0-9][0-9.]*-slim@sha256:[0-9a-f]{64}$ ]] \
            || fail "WATCHDOG_BASE_IMAGE must be google-cloud-cli:<version>-slim pinned by digest"
          [[ "$WATCHDOG_IMAGE" =~ ^[a-z0-9-]+-docker\.pkg\.dev/[a-z][a-z0-9-]+/[a-z][a-z0-9-]*/control-watchdog$ ]] \
            || fail "WATCHDOG_IMAGE must be <region>-docker.pkg.dev/<project>/<repository>/control-watchdog"
          [[ "$GH_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "AUTOSCALER_GH_VERSION must be x.y.z"
          [[ "$GH_SHA256" =~ ^[0-9a-f]{64}$ ]] || fail "AUTOSCALER_GH_SHA256 must be 64 lower-case hex digits"
          [[ "$PUBLISHER_SA" =~ ^[a-z][a-z0-9-]+@[a-z][a-z0-9-]+\.iam\.gserviceaccount\.com$ ]] \
            || fail "WATCHDOG_PUBLISHER_SA must be a service account e-mail"
          [[ "$WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || fail "WATCHDOG_WIF_PROVIDER must be the provider's full resource name"
          echo "IMAGE=${WATCHDOG_IMAGE%/*}/spot-runner-autoscaler" >> "${GITHUB_ENV}"

      - name: Check out
        # actions/checkout v4, pinned to the commit the v4 tag resolved to on 2026-10-17.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Build
        run: |
          docker build \
            --pull \
            --file autoscaler/Dockerfile \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg "GH_VERSION=${GH_VERSION}" \
            --build-arg "GH_SHA256=${GH_SHA256}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.base.name=${BASE_IMAGE}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            .

      - name: Smoke test
        run: |
          docker run --rm --entrypoint python3 "${IMAGE}:${GITHUB_SHA}" -B /app/src/spot_runner_autoscaler.py --help \
            | grep -q -- --host-service-account
          docker run --rm --entrypoint gh "${IMAGE}:${GITHUB_SHA}" --version | grep -q "${GH_VERSION}"
          # Without durable state and the floor lease the entrypoint refuses to start (exit 2) and touches nothing.
          set +e
          docker run --rm "${IMAGE}:${GITHUB_SHA}" --scaling-mode tiered
          status=$?
          set -e
          [[ "$status" == 2 ]] || { echo "::error::an unconfigured execution exited ${status}, not 2"; exit 1; }

      - name: Authenticate to Artifact Registry
        run: |
          set -euo pipefail
          registry="${IMAGE%%/*}"
          audience="https://iam.googleapis.com/${WIF_PROVIDER}"
          oidc="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience}" | jq -r '.value')"
          echo "::add-mask::${oidc}"
          federated="$(jq -n --arg aud "//iam.googleapis.com/${WIF_PROVIDER}" --arg token "${oidc}" '{
              audience: $aud,
              grantType: "urn:ietf:params:oauth:grant-type:token-exchange",
              requestedTokenType: "urn:ietf:params:oauth:token-type:access_token",
              scope: "https://www.googleapis.com/auth/cloud-platform",
              subjectTokenType: "urn:ietf:params:oauth:token-type:jwt",
              subjectToken: $token}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- https://sts.googleapis.com/v1/token \
            | jq -r '.access_token')"
          echo "::add-mask::${federated}"
          access="$(curl -fsS -X POST -H "Authorization: Bearer ${federated}" -H "Content-Type: application/json" \
            --data '{"scope": ["https://www.googleapis.com/auth/cloud-platform"], "lifetime": "600s"}' \
            "https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/${PUBLISHER_SA}:generateAccessToken" \
            | jq -r '.accessToken')"
          echo "::add-mask::${access}"
          [[ -n "$access" && "$access" != null ]] || { echo "::error::no access token"; exit 1; }
          printf '%s' "${access}" | docker login --username oauth2accesstoken --password-stdin "https://${registry}"

      - name: Push
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${GITHUB_SHA}")"
          {
            echo "### Runner autoscaler image"
            echo
            echo "| Reference | Value |"
            echo "| --- | --- |"
            echo "| Commit tag | \`${IMAGE}:${GITHUB_SHA}\` |"
            echo "| Digest | \`${digest}\` |"
            echo "| Base | \`${BASE_IMAGE}\` |"
            echo "| GitHub CLI | \`${GH_VERSION}\` |"
            echo
            echo "Deploy it with \`src/spot_runner_autoscaler_deploy.py --image=${digest}\` (preview first)."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Log out
        if: always()
        run: docker logout "${IMAGE%%/*}" || true
