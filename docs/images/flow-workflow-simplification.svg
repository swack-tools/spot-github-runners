<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Simplified Operator Deployment &amp; Developer Remote Build Workflow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">How the edge Worker and persistent builder cache collapse multi-step operations into single commands.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 400.0 162.5 C 433.0 162.5, 433.0 162.5, 466.0 162.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="370.6" y="141.5" width="124.8" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="433.0" y="155.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">1 command deploy</text>
  <path d="M 400.0 327.5 C 433.0 327.5, 433.0 327.5, 466.0 327.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="391.0" y="306.5" width="84.0" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="433.0" y="320.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Warm cache</text>
  <path d="M 810.0 162.5 C 845.5 162.5, 845.5 245.0, 881.0 245.0" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="789.9" y="182.8" width="111.2" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="845.5" y="196.8" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Serves edge UI</text>
  <path d="M 810.0 327.5 C 845.5 327.5, 845.5 245.0, 881.0 245.0" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="779.7" y="265.2" width="131.6" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="845.5" y="279.2" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Posts build stats</text>
  <g filter="url(#shadow)">    <rect x="60" y="100" width="340" height="125" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="72" y="110" width="119" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="79" y="124" fill="#38bdf8" font-size="10.5" font-weight="700">OPERATOR STEP 1</text>    <text x="74" y="148" fill="#ffffff" font-size="14" font-weight="700">Configure gcloud Default Project</text>
    <text x="74" y="168" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">gcloud config set project example-ci-fleet</text>
    <text x="74" y="186" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">One-time workstation configuration</text>
    <text x="74" y="204" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">No source files edited</text>
  </g>
  <g filter="url(#shadow)">    <rect x="470" y="100" width="340" height="125" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="482" y="110" width="119" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="489" y="124" fill="#34d399" font-size="10.5" font-weight="700">OPERATOR STEP 2</text>    <text x="484" y="148" fill="#ffffff" font-size="14" font-weight="700">Run just deploy-worker</text>
    <text x="484" y="168" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Reads active gcloud project automatically</text>
    <text x="484" y="186" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Builds Wasm &amp; deploys to Cloudflare edge</text>
    <text x="484" y="204" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">5-minute cron reconciler runs automatically</text>
  </g>
  <g filter="url(#shadow)">    <rect x="60" y="265" width="340" height="125" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="72" y="275" width="126" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="79" y="289" fill="#a78bfa" font-size="10.5" font-weight="700">DEVELOPER STEP 1</text>    <text x="74" y="313" fill="#ffffff" font-size="14" font-weight="700">Run Remote Build Command</text>
    <text x="74" y="333" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Streams workspace to builder-* Spot VM</text>
    <text x="74" y="351" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">host-launcher &amp; docker-admission validate</text>
    <text x="74" y="369" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Compiles inside 16 vCPU / 28 GiB container</text>
  </g>
  <g filter="url(#shadow)">    <rect x="470" y="265" width="340" height="125" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="482" y="275" width="126" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="489" y="289" fill="#fbbf24" font-size="10.5" font-weight="700">DEVELOPER STEP 2</text>    <text x="484" y="313" fill="#ffffff" font-size="14" font-weight="700">Receive Artifacts &amp; Telemetry</text>
    <text x="484" y="333" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">375 GB persistent cache hits ~88% of crates</text>
    <text x="484" y="351" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Artifacts streamed back over SSH</text>
    <text x="484" y="369" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Build metrics recorded in dashboard</text>
  </g>
  <g filter="url(#shadow)">    <rect x="885" y="180" width="355" height="130" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="897" y="190" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="904" y="204" fill="#fb7185" font-size="10.5" font-weight="700">UNIFIED VISIBILITY</text>    <text x="899" y="228" fill="#ffffff" font-size="14" font-weight="700">Edge Dashboard (spot.swacktech.com)</text>
    <text x="899" y="248" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Live Spot burn rate &amp; region map</text>
    <text x="899" y="266" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Qualifying offers &amp; scaling decisions</text>
    <text x="899" y="284" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Remote build cache hits &amp; patch PRs</text>
  </g>
  <rect x="624" y="209" width="32" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 520.0 435 L 640 225" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-emerald)"/>
  <g filter="url(#shadow)">    <rect x="180" y="435" width="680" height="58" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="2.2"/>    <text x="194" y="458" fill="#34d399" font-size="12.5" font-weight="700">ZERO MANUAL VM MANAGEMENT</text>    <text x="194" y="478" fill="#e2e8f0" font-size="12">Operators never SSH into control VMs, and developers never manage builder disks or container flags by hand.</text>  </g>
</svg>
