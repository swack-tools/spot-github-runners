<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Dedicated Rust Builder Render-Once Launch &amp; Persistent Cache Disk Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Lifecycle separation between ephemeral Spot compute (n4-highcpu-16) and the persistent 375 GB cache disk.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 255.0 212.5 C 273.0 212.5, 273.0 212.5, 291.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="227.6" y="191.5" width="90.8" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="273.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Ensure disk</text>
  <path d="M 520.0 212.5 C 538.0 212.5, 538.0 212.5, 556.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="492.6" y="191.5" width="90.8" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="538.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Attach disk</text>
  <path d="M 780.0 212.5 C 798.0 212.5, 798.0 212.5, 816.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="739.0" y="191.5" width="118.0" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="798.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Cloud-init runs</text>
  <path d="M 1030.0 212.5 C 1048.0 212.5, 1048.0 212.5, 1066.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="999.2" y="191.5" width="97.6" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="1048.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Probe passes</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="215" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STEP 1 · RENDER</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Render Config Outside Git</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Store in ~/builder-ops/</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Inject SSH keys &amp; project</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Verify &lt; 256 KiB metadata</text>
  </g>
  <g filter="url(#shadow)">    <rect x="295" y="145" width="225" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="307" y="155" width="147" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="314" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STEP 2 · CACHE DISK</text>    <text x="309" y="193" fill="#ffffff" font-size="14" font-weight="700">375 GB Hyperdisk Balanced</text>
    <text x="309" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Persistent cache disk</text>
    <text x="309" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">auto-delete=no invariant</text>
    <text x="309" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Survives VM preemption</text>
  </g>
  <g filter="url(#shadow)">    <rect x="560" y="145" width="220" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="572" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="579" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STEP 3 · SPOT VM</text>    <text x="574" y="193" fill="#ffffff" font-size="14" font-weight="700">Launch n4-highcpu-16</text>
    <text x="574" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">16 vCPU / 32 GiB RAM</text>
    <text x="574" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Zero GitHub runners</text>
    <text x="574" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Attach persistent disk</text>
  </g>
  <g filter="url(#shadow)">    <rect x="820" y="145" width="210" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="832" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="839" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STEP 4 · BOOTSTRAP</text>    <text x="834" y="193" fill="#ffffff" font-size="14" font-weight="700">builder-startup.sh</text>
    <text x="834" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">host-agent host-launcher</text>
    <text x="834" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Mode 02770 workspace</text>
    <text x="834" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">docker-admission wrapper</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1070" y="145" width="175" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="1082" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="1089" y="169" fill="#34d399" font-size="10.5" font-weight="700">STEP 5 · READY</text>    <text x="1084" y="193" fill="#ffffff" font-size="14" font-weight="700">Readiness JSON</text>
    <text x="1084" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Verify Rust 1.99.0 hash</text>
    <text x="1084" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">16 CPU / 28 GiB cap</text>
    <text x="1084" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Write readiness.json</text>
  </g>
  <rect x="391" y="264" width="32" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 620.0 365 L 407 280" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">    <rect x="295" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2.2"/>    <text x="309" y="388" fill="#a78bfa" font-size="12.5" font-weight="700">PERSISTENT CACHE INVARIANT</text>    <text x="309" y="408" fill="#e2e8f0" font-size="12">Deleting or preempting a builder-* VM never deletes its persistent cache disk (auto-delete=no).</text>  </g>
</svg>
