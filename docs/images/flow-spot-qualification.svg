<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Flowchart for Identifying the Cheapest Qualifying Spot Offer for a Project</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Four-stage edge qualification pipeline filtering regions, hardware benchmark floors, and all-in Spot budgets.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 260.0 212.5 C 283.0 212.5, 283.0 212.5, 306.0 212.5" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="230.8" y="191.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="283.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Enabled zones</text>
  <path d="M 535.0 212.5 C 558.0 212.5, 558.0 212.5, 581.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="512.6" y="191.5" width="90.8" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="558.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Meets bench</text>
  <path d="M 820.0 212.5 C 843.0 212.5, 843.0 212.5, 866.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="794.2" y="191.5" width="97.6" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="843.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">All-in $/day</text>
  <path d="M 1050.0 212.5 C 1068.0 212.5, 1068.0 212.5, 1086.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="1015.8" y="191.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="1068.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Within budget</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="220" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="133" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STAGE 1 · REGIONS</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Region &amp; Latency Filter</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Enabled regions only</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Backend latency &lt;= cap</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Supported disk series</text>
  </g>
  <g filter="url(#shadow)">    <rect x="310" y="145" width="225" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="322" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="329" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STAGE 2 · HARDWARE</text>    <text x="324" y="193" fill="#ffffff" font-size="14" font-weight="700">Shape &amp; Benchmark Floor</text>
    <text x="324" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">vCPU &amp; RAM &gt;= profile min</text>
    <text x="324" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">CPU benchmark &gt;= 1000/1400</text>
    <text x="324" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Units needed for floor</text>
  </g>
  <g filter="url(#shadow)">    <rect x="585" y="145" width="235" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="597" y="155" width="161" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="604" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STAGE 3 · ALL-IN COST</text>    <text x="599" y="193" fill="#ffffff" font-size="14" font-weight="700">Spot + Disk + Tax Pricing</text>
    <text x="599" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Spot compute $/hr * hosts</text>
    <text x="599" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">+ Hyperdisk/PD $/day</text>
    <text x="599" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">+ Regional tax rate %</text>
  </g>
  <g filter="url(#shadow)">    <rect x="870" y="145" width="180" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="882" y="155" width="161" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="889" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STAGE 4 · BUDGET GATE</text>    <text x="884" y="193" fill="#ffffff" font-size="14" font-weight="700">Compare Budget Cap</text>
    <text x="884" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">&lt;= $/hr, $/day, $/mo?</text>
    <text x="884" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Over cap -&gt; Disqualify</text>
    <text x="884" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Under cap -&gt; Qualifies</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1090" y="145" width="155" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="1102" y="155" width="56" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="1109" y="169" fill="#34d399" font-size="10.5" font-weight="700">RESULT</text>    <text x="1104" y="193" fill="#ffffff" font-size="14" font-weight="700">Cheapest Spot Pick</text>
    <text x="1104" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Sort ascending $/hr</text>
    <text x="1104" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Select top zone</text>
    <text x="1104" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Ready for launch</text>
  </g>
  <rect x="944" y="264" width="32" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 635.0 365 L 960 280" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <g filter="url(#shadow)">    <rect x="310" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#fb7185" stroke-width="2.2"/>    <text x="324" y="388" fill="#fb7185" font-size="12.5" font-weight="700">PRICE QUALIFICATION GATE</text>    <text x="324" y="408" fill="#e2e8f0" font-size="12">Offers that pass hardware benchmark floors but exceed the daily budget cap are marked Exceeds Budget Cap.</text>  </g>
</svg>
