<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Defense-in-Depth Security &amp; Admission Boundary Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Four independent security gates across the edge dashboard, patch console, host launcher, and container runtime.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 305.0 217.5 C 325.5 217.5, 325.5 217.5, 346.0 217.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="273.3" y="196.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="325.5" y="210.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Authenticated</text>
  <path d="M 615.0 217.5 C 635.5 217.5, 635.5 217.5, 656.0 217.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="573.1" y="196.5" width="124.8" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="635.5" y="210.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Validated config</text>
  <path d="M 925.0 217.5 C 945.5 217.5, 945.5 217.5, 966.0 217.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="876.3" y="196.5" width="138.4" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="945.5" y="210.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Prepared workspace</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="265" height="145" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">GATE 1 · EDGE AUTH</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">HMAC Session &amp; Admin Check</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">__Host-spot_session cookie</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Constant-time HMAC-SHA256</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Owner or KV admin required</text>
    <text x="54" y="267" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Origin IP redacted in API</text>
  </g>
  <g filter="url(#shadow)">    <rect x="350" y="145" width="265" height="145" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="362" y="155" width="168" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="369" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">GATE 2 · PATCH CONSOLE</text>    <text x="364" y="193" fill="#ffffff" font-size="14" font-weight="700">Manifest Security Validator</text>
    <text x="364" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">cloudflare/src/patch.rs</text>
    <text x="364" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Blocks /var/run/docker.sock</text>
    <text x="364" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Blocks .. path traversal</text>
    <text x="364" y="267" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Saves via GitHub PR only</text>
  </g>
  <g filter="url(#shadow)">    <rect x="660" y="145" width="265" height="145" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="672" y="155" width="182" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="679" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">GATE 3 · HOST FILESYSTEM</text>    <text x="674" y="193" fill="#ffffff" font-size="14" font-weight="700">Launcher &amp; Safe Cleanup</text>
    <text x="674" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">host-launcher regex check</text>
    <text x="674" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Mode 02770 group sticky</text>
    <text x="674" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">clean-target openat/unlinkat</text>
    <text x="674" y="267" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">O_NOFOLLOW refuses symlinks</text>
  </g>
  <g filter="url(#shadow)">    <rect x="970" y="145" width="270" height="145" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="982" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="989" y="169" fill="#fb7185" font-size="10.5" font-weight="700">GATE 4 · CONTAINER</text>    <text x="984" y="193" fill="#ffffff" font-size="14" font-weight="700">Docker Wrapper &amp; Admission</text>
    <text x="984" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">UID/GID 1001 unprivileged</text>
    <text x="984" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">--cap-drop ALL &amp; no-new-privs</text>
    <text x="984" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">16 vCPU / 28 GiB hard cap</text>
    <text x="984" y="267" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Loopback 127.0.0.1 port bind</text>
  </g>
  <rect x="1089" y="274" width="32" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 670.0 370 L 1105 290" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <g filter="url(#shadow)">    <rect x="350" y="370" width="640" height="58" rx="9" fill="#0f172a" stroke="#fb7185" stroke-width="2.2"/>    <text x="364" y="393" fill="#fb7185" font-size="12.5" font-weight="700">ZERO DOCKER SOCKET EXPOSURE</text>    <text x="364" y="413" fill="#e2e8f0" font-size="12">Builder containers never receive /var/run/docker.sock, root UID 0, or extra Linux capabilities.</text>  </g>
</svg>
