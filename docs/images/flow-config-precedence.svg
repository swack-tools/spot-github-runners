<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Configuration, gcloud Project Discovery &amp; Wrangler Secret Binding Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">How GCP_PROJECT is discovered at deploy time while sensitive credentials remain in Wrangler secrets and .env.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 265.0 212.5 C 285.5 212.5, 285.5 212.5, 306.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="243.5" y="191.5" width="84.0" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="285.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Project ID</text>
  <path d="M 540.0 212.5 C 815.5 212.5, 815.5 212.5, 1091.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="749.7" y="191.5" width="131.6" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="815.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">--var GCP_PROJECT</text>
  <path d="M 815.0 212.5 C 953.0 212.5, 953.0 212.5, 1091.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="883.8" y="191.5" width="138.4" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="953.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Encrypted bindings</text>
  <path d="M 1055.0 212.5 C 1073.0 212.5, 1073.0 212.5, 1091.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="1007.2" y="191.5" width="131.6" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="1073.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">SPOT_KV namespace</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="225" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="147" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STEP 1 · GCLOUD CLI</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Default GCP Project</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">gcloud config get-value</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Returns active project ID</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Zero hardcoded IDs in Rust</text>
  </g>
  <g filter="url(#shadow)">    <rect x="310" y="145" width="230" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="322" y="155" width="154" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="329" y="169" fill="#34d399" font-size="10.5" font-weight="700">STEP 2 · JUST RECIPE</text>    <text x="324" y="193" fill="#ffffff" font-size="14" font-weight="700">just deploy-worker</text>
    <text x="324" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Reads just gcp-project</text>
    <text x="324" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Passes --var GCP_PROJECT:...</text>
    <text x="324" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Compiles Wasm release</text>
  </g>
  <g filter="url(#shadow)">    <rect x="585" y="145" width="230" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="597" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="604" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STEP 3 · SECRETS</text>    <text x="599" y="193" fill="#ffffff" font-size="14" font-weight="700">Wrangler Secret Store</text>
    <text x="599" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">DASHBOARD_SESSION_SECRET</text>
    <text x="599" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GCP_SERVICE_ACCOUNT_JSON</text>
    <text x="599" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GITHUB_TOKEN / OAUTH</text>
  </g>
  <g filter="url(#shadow)">    <rect x="860" y="145" width="195" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="872" y="155" width="147" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="879" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STEP 4 · KV BINDING</text>    <text x="874" y="193" fill="#ffffff" font-size="14" font-weight="700">wrangler.toml Binding</text>
    <text x="874" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">binding = &quot;SPOT_KV&quot;</text>
    <text x="874" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Edge state &amp; token cache</text>
    <text x="874" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Admin allowlist</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1095" y="145" width="150" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="1107" y="155" width="105" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="1114" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STEP 5 · LIVE</text>    <text x="1109" y="193" fill="#ffffff" font-size="14" font-weight="700">Edge Worker</text>
    <text x="1109" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Renders project</text>
    <text x="1109" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Signs sessions</text>
    <text x="1109" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Runs cron tick</text>
  </g>
  <rect x="409" y="264" width="32" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 635.0 365 L 425 280" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-emerald)"/>
  <g filter="url(#shadow)">    <rect x="310" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="2.2"/>    <text x="324" y="388" fill="#34d399" font-size="12.5" font-weight="700">NO COMPILED-IN PROJECT IDS</text>    <text x="324" y="408" fill="#e2e8f0" font-size="12">test_gcp_project_source.rs verifies that no real GCP project identifier is compiled into the Worker source.</text>  </g>
</svg>
