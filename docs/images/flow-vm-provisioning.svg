<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Automated Spot VM Provisioning &amp; Cloud-Init Bootstrap Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">How the edge reconciler provisions a Compute Engine Spot instance and bootstraps host-agent at boot.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 255.0 212.5 C 275.5 212.5, 275.5 212.5, 296.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="230.1" y="191.5" width="90.8" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="275.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">POST insert</text>
  <path d="M 525.0 212.5 C 545.5 212.5, 545.5 212.5, 566.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="510.3" y="191.5" width="70.4" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="545.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">VM boots</text>
  <path d="M 795.0 212.5 C 815.5 212.5, 815.5 212.5, 836.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="759.9" y="191.5" width="111.2" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="815.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Symlinks ready</text>
  <path d="M 1040.0 212.5 C 1058.0 212.5, 1058.0 212.5, 1076.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="1009.2" y="191.5" width="97.6" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="1058.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Listeners up</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="215" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="147" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STEP 1 · RECONCILER</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Capacity Deficit Detected</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Online runners &lt; floor (6)</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">or queued_jobs &gt;= 20</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Pick enabled zone</text>
  </g>
  <g filter="url(#shadow)">    <rect x="300" y="145" width="225" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="312" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="319" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STEP 2 · GCE API</text>    <text x="314" y="193" fill="#ffffff" font-size="14" font-weight="700">instances.insert (Spot)</text>
    <text x="314" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">provisioningModel: SPOT</text>
    <text x="314" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">instanceTerminationAction</text>
    <text x="314" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Inject startup-script</text>
  </g>
  <g filter="url(#shadow)">    <rect x="570" y="145" width="225" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="582" y="155" width="147" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="589" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STEP 3 · CLOUD-INIT</text>    <text x="584" y="193" fill="#ffffff" font-size="14" font-weight="700">Format Disk &amp; Install</text>
    <text x="584" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Mount /mnt/runner-data</text>
    <text x="584" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Install host-agent binary</text>
    <text x="584" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Create symlink aliases</text>
  </g>
  <g filter="url(#shadow)">    <rect x="840" y="145" width="200" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="852" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="859" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STEP 4 · ADMISSION</text>    <text x="854" y="193" fill="#ffffff" font-size="14" font-weight="700">Start Lease Daemon</text>
    <text x="854" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">host-agent admission</text>
    <text x="854" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">docker-wrapper active</text>
    <text x="854" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">leases.json initialized</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1080" y="145" width="165" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="1092" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="1099" y="169" fill="#34d399" font-size="10.5" font-weight="700">STEP 5 · READY</text>    <text x="1094" y="193" fill="#ffffff" font-size="14" font-weight="700">Register Listeners</text>
    <text x="1094" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GitHub runner token</text>
    <text x="1094" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">2 ephemeral containers</text>
    <text x="1094" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Online in dashboard</text>
  </g>
  <rect x="664" y="264" width="32" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 620.0 365 L 680 280" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">    <rect x="300" y="365" width="640" height="58" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2.2"/>    <text x="314" y="388" fill="#a78bfa" font-size="12.5" font-weight="700">SEPARATE LIFECYCLES</text>    <text x="314" y="408" fill="#e2e8f0" font-size="12">Runner hosts use auto-deleting data disks; dedicated builders attach persistent cache disks (auto-delete=no).</text>  </g>
</svg>
