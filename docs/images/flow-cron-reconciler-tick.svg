<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Scheduled 5-Minute Cloudflare Worker Reconciler Tick (*/5 * * * *)</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Deterministic execution sequence inside #[event(scheduled)] in cloudflare/src/reconciler.rs.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 240.0 212.5 C 258.0 212.5, 258.0 212.5, 276.0 212.5" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="209.2" y="191.5" width="97.6" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="258.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Load secrets</text>
  <path d="M 495.0 212.5 C 513.0 212.5, 513.0 212.5, 531.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="457.4" y="191.5" width="111.2" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="513.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Parallel fetch</text>
  <path d="M 755.0 212.5 C 773.0 212.5, 773.0 212.5, 791.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="720.8" y="191.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="773.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Compute delta</text>
  <path d="M 1020.0 212.5 C 1038.0 212.5, 1038.0 212.5, 1056.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="992.6" y="191.5" width="90.8" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="1038.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Save bundle</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="200" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="52" y="155" width="98" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="59" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">CRON TRIGGER</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">#[event(scheduled)]</text>
    <text x="54" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Every 5 minutes at edge</text>
    <text x="54" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">No control VM required</text>
    <text x="54" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Reads SPOT_KV state</text>
  </g>
  <g filter="url(#shadow)">    <rect x="280" y="145" width="215" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="292" y="155" width="84" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="299" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">AUTH CACHE</text>    <text x="294" y="193" fill="#ffffff" font-size="14" font-weight="700">Mint &amp; Cache Tokens</text>
    <text x="294" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GCP OAuth2 Bearer token</text>
    <text x="294" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GitHub App installation</text>
    <text x="294" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Cached in SPOT_KV</text>
  </g>
  <g filter="url(#shadow)">    <rect x="535" y="145" width="220" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="547" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="554" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">LIVE INVENTORY</text>    <text x="549" y="193" fill="#ffffff" font-size="14" font-weight="700">Query GCE &amp; GitHub</text>
    <text x="549" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">List runner-us* VMs</text>
    <text x="549" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">List GitHub runner slots</text>
    <text x="549" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Count queued workflow jobs</text>
  </g>
  <g filter="url(#shadow)">    <rect x="795" y="145" width="225" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="807" y="155" width="77" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="814" y="169" fill="#fb7185" font-size="10.5" font-weight="700">RECONCILE</text>    <text x="809" y="193" fill="#ffffff" font-size="14" font-weight="700">Clean &amp; Scale Fleet</text>
    <text x="809" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Delete TERMINATED VMs</text>
    <text x="809" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Deregister dead runners</text>
    <text x="809" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Provision if below target</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1060" y="145" width="185" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="1072" y="155" width="63" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="1079" y="169" fill="#34d399" font-size="10.5" font-weight="700">PERSIST</text>    <text x="1074" y="193" fill="#ffffff" font-size="14" font-weight="700">Update SPOT_KV</text>
    <text x="1074" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Write overview_bundle</text>
    <text x="1074" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Increment reconciler_ticks</text>
    <text x="1074" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Stamp last_run_epoch</text>
  </g>
  <rect x="1134" y="264" width="32" height="32" rx="16" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 605.0 365 L 1150 280" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-emerald)"/>
  <g filter="url(#shadow)">    <rect x="280" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="2.2"/>    <text x="294" y="388" fill="#34d399" font-size="12.5" font-weight="700">KV QUOTA GUARD</text>    <text x="294" y="408" fill="#e2e8f0" font-size="12">Token caching and fingerprint checks skip redundant KV writes when fleet state has not changed.</text>  </g>
</svg>
