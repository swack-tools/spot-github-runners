<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Cloudflare Worker Request Routing &amp; KV State Synchronization Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">How #[event(fetch)] authenticates requests and serves embedded Wasm UI assets and JSON endpoints.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 250.0 212.5 C 270.5 212.5, 270.5 212.5, 291.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="211.5" y="191.5" width="118.0" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="270.5" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Protected route</text>
  <path d="M 520.0 212.5 C 543.0 212.5, 543.0 147.5, 566.0 147.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="490.8" y="159.0" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="543.0" y="173.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">HTML document</text>
  <path d="M 520.0 212.5 C 543.0 212.5, 543.0 292.5, 566.0 292.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="490.8" y="231.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="543.0" y="245.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">JSON endpoint</text>
  <path d="M 800.0 147.5 C 825.5 147.5, 825.5 212.5, 851.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="746.1" y="159.0" width="158.8" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="825.5" y="173.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Fetches /api/overview</text>
  <path d="M 800.0 292.5 C 825.5 292.5, 825.5 212.5, 851.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="773.3" y="231.5" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="825.5" y="245.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Read/Write KV</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="210" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">CLOUDFLARE EDGE</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Incoming HTTP Request</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">#[event(fetch)] entry</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Public: /api/health, /login</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">All others require session</text>
  </g>
  <g filter="url(#shadow)">    <rect x="295" y="145" width="225" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="307" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="314" y="169" fill="#fb7185" font-size="10.5" font-weight="700">SESSION VERIFY</text>    <text x="309" y="193" fill="#ffffff" font-size="14" font-weight="700">Verify Cookie &amp; Admin</text>
    <text x="309" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Constant-time HMAC check</text>
    <text x="309" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Check exp &gt; now</text>
    <text x="309" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Revalidate may_sign_in</text>
  </g>
  <g filter="url(#shadow)">    <rect x="570" y="90" width="230" height="115" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="582" y="100" width="49" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="589" y="114" fill="#34d399" font-size="10.5" font-weight="700">GET /</text>    <text x="584" y="138" fill="#ffffff" font-size="14" font-weight="700">Serve Embedded UI</text>
    <text x="584" y="158" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">cloudflare/src/ui.rs</text>
    <text x="584" y="176" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Inject GCP_PROJECT header</text>
    <text x="584" y="194" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Single-page &lt; 200 KiB</text>
  </g>
  <g filter="url(#shadow)">    <rect x="570" y="235" width="230" height="115" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="582" y="245" width="133" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="589" y="259" fill="#a78bfa" font-size="10.5" font-weight="700">GET / POST /api/*</text>    <text x="584" y="283" fill="#ffffff" font-size="14" font-weight="700">REST API Handlers</text>
    <text x="584" y="303" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">/api/overview &amp; /api/scaling</text>
    <text x="584" y="321" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">/api/patch-console/*</text>
    <text x="584" y="339" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">/api/admins (owner-only)</text>
  </g>
  <g filter="url(#shadow)">    <rect x="855" y="145" width="385" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="867" y="155" width="161" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="874" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">CLOUDFLARE WORKERS KV</text>    <text x="869" y="193" fill="#ffffff" font-size="14" font-weight="700">SPOT_KV State &amp; GitHub/GCE Calls</text>
    <text x="869" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Read cached overview bundle in &lt;15 ms</text>
    <text x="869" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Refresh GCE inventory on demand</text>
    <text x="869" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Open GitHub PRs via /api/patch-console/save</text>
  </g>
  <rect x="669" y="334" width="32" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 620.0 415 L 685 350" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">    <rect x="295" y="415" width="650" height="58" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2.2"/>    <text x="309" y="438" fill="#a78bfa" font-size="12.5" font-weight="700">PLAN-ONLY UI PREVIEWS</text>    <text x="309" y="458" fill="#e2e8f0" font-size="12">Dashboard scale buttons (/api/instances/scale-region) return dry-run plans and never mutate live VMs.</text>  </g>
</svg>
