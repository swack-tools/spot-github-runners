<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Remote Rust Build Execution, Container Admission &amp; Artifact Delivery Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">End-to-end execution of a remote cargo build inside an unprivileged UID 1001 builder container.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 250.0 212.5 C 268.0 212.5, 268.0 212.5, 286.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="209.0" y="191.5" width="118.0" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="268.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Invoke launcher</text>
  <path d="M 510.0 212.5 C 528.0 212.5, 528.0 212.5, 546.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="469.0" y="191.5" width="118.0" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="528.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Spawn container</text>
  <path d="M 785.0 212.5 C 803.0 212.5, 803.0 212.5, 821.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="767.8" y="191.5" width="70.4" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="803.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Admitted</text>
  <path d="M 1035.0 212.5 C 1053.0 212.5, 1053.0 212.5, 1071.0 212.5" fill="none" stroke="#fbbf24" stroke-width="2.4" marker-end="url(#arrow-amber)"/>
  <rect x="987.2" y="191.5" width="131.6" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
  <text x="1053.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Artifacts + stats</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="210" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="52" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="59" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STEP 1 · CLIENT</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Direct SSH Invocation</text>
    <text x="54" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Authenticated SSH stream</text>
    <text x="54" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Sync source worktree</text>
    <text x="54" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Pass project identifier</text>
  </g>
  <g filter="url(#shadow)">    <rect x="290" y="145" width="220" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="302" y="155" width="133" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="309" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STEP 2 · LAUNCHER</text>    <text x="304" y="193" fill="#ffffff" font-size="14" font-weight="700">host-agent host-launcher</text>
    <text x="304" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Validate project regex</text>
    <text x="304" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Enforce 02770 dir perms</text>
    <text x="304" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">clean-target if requested</text>
  </g>
  <g filter="url(#shadow)">    <rect x="550" y="145" width="235" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="562" y="155" width="154" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="569" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STEP 3 · DOCKER GATE</text>    <text x="564" y="193" fill="#ffffff" font-size="14" font-weight="700">host-agent docker-admission</text>
    <text x="564" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Require --user 1001:1001</text>
    <text x="564" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Require --cpus 16 -m 28g</text>
    <text x="564" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Require --cap-drop ALL</text>
  </g>
  <g filter="url(#shadow)">    <rect x="825" y="145" width="210" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="837" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="844" y="169" fill="#34d399" font-size="10.5" font-weight="700">STEP 4 · COMPILE</text>    <text x="839" y="193" fill="#ffffff" font-size="14" font-weight="700">worktree-commands</text>
    <text x="839" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">builder-entrypoint check</text>
    <text x="839" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Compile with warm cache</text>
    <text x="839" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Sample cgroup v2 peak RAM</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1075" y="145" width="170" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="1087" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="1094" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STEP 5 · DELIVER</text>    <text x="1089" y="193" fill="#ffffff" font-size="14" font-weight="700">Stream &amp; Record</text>
    <text x="1089" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Deliver build artifacts</text>
    <text x="1089" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Redact origin IP in API</text>
    <text x="1089" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Record CPU points</text>
  </g>
  <rect x="651" y="264" width="32" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 615.0 365 L 667 280" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <g filter="url(#shadow)">    <rect x="290" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#fb7185" stroke-width="2.2"/>    <text x="304" y="388" fill="#fb7185" font-size="12.5" font-weight="700">UNPRIVILEGED CONTAINER BOUNDARY</text>    <text x="304" y="408" fill="#e2e8f0" font-size="12">docker-admission blocks any container missing UID 1001, 28 GiB RAM cap, or mounting docker.sock.</text>  </g>
</svg>
