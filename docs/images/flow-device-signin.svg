<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Dashboard GitHub OAuth 2.0, Device Code &amp; Session Cookie Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Dual sign-in paths issuing an HMAC-SHA256 signed __Host-spot_session cookie after administrator verification.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 250.0 212.5 C 270.5 212.5, 270.5 147.5, 291.0 147.5" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="218.3" y="159.0" width="104.4" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="270.5" y="173.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Browser login</text>
  <path d="M 250.0 212.5 C 270.5 212.5, 270.5 292.5, 291.0 292.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="204.7" y="231.5" width="131.6" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="270.5" y="245.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">CLI / device code</text>
  <path d="M 530.0 147.5 C 553.0 147.5, 553.0 212.5, 576.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="480.4" y="159.0" width="145.2" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="553.0" y="173.0" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">GitHub user profile</text>
  <path d="M 530.0 292.5 C 553.0 292.5, 553.0 212.5, 576.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="480.4" y="231.5" width="145.2" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="553.0" y="245.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">GitHub user profile</text>
  <path d="M 815.0 212.5 C 838.0 212.5, 838.0 212.5, 861.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="768.8" y="191.5" width="138.4" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="838.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">may_sign_in = true</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="210" height="135" rx="10" fill="#162032" stroke="#94a3b8" stroke-width="2"/>    <rect x="52" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>    <text x="59" y="169" fill="#94a3b8" font-size="10.5" font-weight="700">UNAUTHENTICATED</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Request Protected Route</text>
    <text x="54" y="213" fill="#f1f5f9" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GET / or /api/*</text>
    <text x="54" y="231" fill="#f1f5f9" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Missing/expired cookie</text>
    <text x="54" y="249" fill="#f1f5f9" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Render /login gate</text>
  </g>
  <g filter="url(#shadow)">    <rect x="295" y="90" width="235" height="115" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="307" y="100" width="140" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="314" y="114" fill="#38bdf8" font-size="10.5" font-weight="700">PATH A · WEB OAUTH</text>    <text x="309" y="138" fill="#ffffff" font-size="14" font-weight="700">GitHub OAuth 2.0 Redirect</text>
    <text x="309" y="158" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">GET /auth/github/login</text>
    <text x="309" y="176" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Verify __Host-spot_oauth_state</text>
    <text x="309" y="194" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Exchange code for user</text>
  </g>
  <g filter="url(#shadow)">    <rect x="295" y="235" width="235" height="115" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="307" y="245" width="154" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="314" y="259" fill="#a78bfa" font-size="10.5" font-weight="700">PATH B · DEVICE FLOW</text>    <text x="309" y="283" fill="#ffffff" font-size="14" font-weight="700">RFC 8628 Device Code</text>
    <text x="309" y="303" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">POST /auth/device/code</text>
    <text x="309" y="321" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">User enters 8-char code</text>
    <text x="309" y="339" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Poll /auth/device/token</text>
  </g>
  <g filter="url(#shadow)">    <rect x="580" y="145" width="235" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="592" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="599" y="169" fill="#fb7185" font-size="10.5" font-weight="700">AUTHORIZATION GATE</text>    <text x="594" y="193" fill="#ffffff" font-size="14" font-weight="700">Check Owner or Admin</text>
    <text x="594" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Compare numeric GitHub UID</text>
    <text x="594" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Owner (DASHBOARD_OWNER_*)</text>
    <text x="594" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">or KV auth/admins/v1</text>
  </g>
  <g filter="url(#shadow)">    <rect x="865" y="145" width="375" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="877" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="884" y="169" fill="#34d399" font-size="10.5" font-weight="700">SESSION ISSUED</text>    <text x="879" y="193" fill="#ffffff" font-size="14" font-weight="700">Set __Host-spot_session Cookie</text>
    <text x="879" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Payload: {uid, login, iat, exp}</text>
    <text x="879" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Signed with HMAC-SHA256 secret</text>
    <text x="879" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">HttpOnly; Secure; SameSite=Lax; Path=/</text>
  </g>
  <rect x="681" y="264" width="32" height="32" rx="16" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 630.0 415 L 697 280" fill="none" stroke="#fb7185" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-rose)"/>
  <g filter="url(#shadow)">    <rect x="300" y="415" width="660" height="58" rx="9" fill="#0f172a" stroke="#fb7185" stroke-width="2.2"/>    <text x="314" y="438" fill="#fb7185" font-size="12.5" font-weight="700">EVERY REQUEST REVALIDATED</text>    <text x="314" y="458" fill="#e2e8f0" font-size="12">Every protected API route re-checks may_sign_in against KV so revoked admins lose access immediately.</text>  </g>
</svg>
