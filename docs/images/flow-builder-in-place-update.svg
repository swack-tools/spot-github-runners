<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" filterUnits="userSpaceOnUse" x="0" y="0" width="1280" height="560">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.55"/>
    </pattern>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/></marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#a78bfa"/></marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/></marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/></marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1280" height="560" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="68" width="1276" height="490" fill="url(#grid)"/>
  <rect x="2" y="2" width="1276" height="66" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="35" r="7" fill="#38bdf8"/>
  <text x="48" y="31" fill="#f8fafc" font-size="18" font-weight="700">Dedicated Builder In-Place Runtime &amp; Toolchain Update Flow</text>
  <text x="48" y="52" fill="#94a3b8" font-size="12.5">Updating host-agent or the Rust 1.99.0 builder container on a running builder VM without losing warm cache.</text>
  <rect x="1115" y="18" width="142" height="30" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="1186" y="38" text-anchor="middle" fill="#38bdf8" font-size="11.5" font-weight="700">MERMAID FLOW SVG</text>
  <path d="M 250.0 212.5 C 268.0 212.5, 268.0 212.5, 286.0 212.5" fill="none" stroke="#38bdf8" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <rect x="229.4" y="191.5" width="77.2" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="268.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Host idle</text>
  <path d="M 510.0 212.5 C 528.0 212.5, 528.0 212.5, 546.0 212.5" fill="none" stroke="#a78bfa" stroke-width="2.4" marker-end="url(#arrow-purple)"/>
  <rect x="489.4" y="191.5" width="77.2" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
  <text x="528.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Run probe</text>
  <path d="M 780.0 212.5 C 798.0 212.5, 798.0 212.5, 816.0 212.5" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-rose)"/>
  <rect x="749.2" y="191.5" width="97.6" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>
  <text x="798.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">Toolchain OK</text>
  <path d="M 1030.0 212.5 C 1048.0 212.5, 1048.0 212.5, 1066.0 212.5" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-emerald)"/>
  <rect x="989.0" y="191.5" width="118.0" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
  <text x="1048.0" y="205.5" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="600">All checks pass</text>
  <g filter="url(#shadow)">    <rect x="40" y="145" width="210" height="135" rx="10" fill="#332108" stroke="#fbbf24" stroke-width="2"/>    <rect x="52" y="155" width="126" height="20" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>    <text x="59" y="169" fill="#fbbf24" font-size="10.5" font-weight="700">STEP 1 · QUIESCE</text>    <text x="54" y="193" fill="#ffffff" font-size="14" font-weight="700">Check Active Builds</text>
    <text x="54" y="213" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Inspect active worktrees</text>
    <text x="54" y="231" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Wait for in-flight compile</text>
    <text x="54" y="249" fill="#fef3c7" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Preserve /mnt/builder-cache</text>
  </g>
  <g filter="url(#shadow)">    <rect x="290" y="145" width="220" height="135" rx="10" fill="#0f2942" stroke="#38bdf8" stroke-width="2"/>    <rect x="302" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>    <text x="309" y="169" fill="#38bdf8" font-size="10.5" font-weight="700">STEP 2 · UPLOAD</text>    <text x="304" y="193" fill="#ffffff" font-size="14" font-weight="700">Deploy Binary &amp; Image</text>
    <text x="304" y="213" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Update /usr/local/bin/host-agent</text>
    <text x="304" y="231" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Refresh symlink aliases</text>
    <text x="304" y="249" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Load builder image</text>
  </g>
  <g filter="url(#shadow)">    <rect x="550" y="145" width="230" height="135" rx="10" fill="#241646" stroke="#a78bfa" stroke-width="2"/>    <rect x="562" y="155" width="112" height="20" rx="5" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>    <text x="569" y="169" fill="#a78bfa" font-size="10.5" font-weight="700">STEP 3 · PROBE</text>    <text x="564" y="193" fill="#ffffff" font-size="14" font-weight="700">host-agent toolchain-probe</text>
    <text x="564" y="213" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Verify root-owned binaries</text>
    <text x="564" y="231" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Check rustc 1.99.0 commit</text>
    <text x="564" y="249" fill="#ede9fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Check cgroup v2 limits</text>
  </g>
  <g filter="url(#shadow)">    <rect x="820" y="145" width="210" height="135" rx="10" fill="#38111c" stroke="#fb7185" stroke-width="2"/>    <rect x="832" y="155" width="140" height="20" rx="5" fill="#0f172a" stroke="#fb7185" stroke-width="1"/>    <text x="839" y="169" fill="#fb7185" font-size="10.5" font-weight="700">STEP 4 · ADMISSION</text>    <text x="834" y="193" fill="#ffffff" font-size="14" font-weight="700">Verify Security Gate</text>
    <text x="834" y="213" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Test docker-admission</text>
    <text x="834" y="231" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">UID/GID 1001 enforced</text>
    <text x="834" y="249" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">28 GiB memory.max cap</text>
  </g>
  <g filter="url(#shadow)">    <rect x="1070" y="145" width="175" height="135" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="1082" y="155" width="119" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="1089" y="169" fill="#34d399" font-size="10.5" font-weight="700">STEP 5 · RECORD</text>    <text x="1084" y="193" fill="#ffffff" font-size="14" font-weight="700">Stamp Readiness JSON</text>
    <text x="1084" y="213" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">oxidex-builder-readiness</text>
    <text x="1084" y="231" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">ready: true</text>
    <text x="1084" y="249" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Resume remote builds</text>
  </g>
  <rect x="649" y="264" width="32" height="32" rx="16" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="5,4"/>
  <path d="M 625.0 365 L 665 280" fill="none" stroke="#a78bfa" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
  <g filter="url(#shadow)">    <rect x="300" y="365" width="650" height="58" rx="9" fill="#0f172a" stroke="#a78bfa" stroke-width="2.2"/>    <text x="314" y="388" fill="#a78bfa" font-size="12.5" font-weight="700">LIVE VERIFICATION REQUIRED</text>    <text x="314" y="408" fill="#e2e8f0" font-size="12">Never route builds to an updated host until toolchain-probe and oxidex-builder-readiness.json succeed.</text>  </g>
</svg>
