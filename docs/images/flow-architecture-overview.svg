    <text x="384" y="376" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Checks runner floor (6)</text>
    <text x="384" y="394" fill="#d1fae5" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">Scales when queued &gt;= 20</text>
  </g>
