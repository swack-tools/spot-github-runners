  </g>
  <g filter="url(#shadow)">    <rect x="370" y="290" width="250" height="125" rx="10" fill="#062e22" stroke="#34d399" stroke-width="2"/>    <rect x="382" y="300" width="147" height="20" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>    <text x="389" y="314" fill="#34d399" font-size="10.5" font-weight="700">TIER 1 · CRON (*/5)</text>    <text x="384" y="338" fill="#ffffff" font-size="14" font-weight="700">Scheduled Reconciler</text>
