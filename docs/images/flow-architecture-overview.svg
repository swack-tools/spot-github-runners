    <text x="704" y="376" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">builder-*: n4-highcpu-16</text>
    <text x="704" y="394" fill="#e0f2fe" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">375 GB persistent cache</text>
  </g>
