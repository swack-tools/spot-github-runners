    <text x="1014" y="268" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">host-admission leases</text>
    <text x="1014" y="286" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">clean-target (unlinkat)</text>
    <text x="1014" y="304" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">docker-admission gate</text>
    <text x="1014" y="322" fill="#ffe4e6" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">worktree-commands</text>
